<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | CarnegienFreedom - Educational Insights & Scam Awareness</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="description"
        content="Read the latest educational articles on avoiding scams, finding legitimate opportunities, and improving your life safely. Trusted insights from CarnegienFreedom.">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/style.css?v=20261014-clickable-social">
    <link rel="stylesheet" href="styles/blog-style.css">

</head>

<body data-shared-scripts="scripts/script.js scripts/db.js scripts/blog.js">
    <!-- Navigation -->
    <div data-shared-header></div>

    <!-- Blog Hero -->
    <section class="blog-hero">
        <div class="container">
            <h1>CarnegienFreedom Blog</h1>
            <p>Educational insights, scam awareness tips, and practical guidance to help you navigate opportunities
                safely and confidently.</p>
        </div>
    </section>

    <!-- Blog Content -->
    <div class="blog-container">
        <!-- Filters -->
        <div class="blog-filters">
            <div class="category-filters" id="categoryFilters">
                <button class="filter-btn active" data-category="all">All Posts</button>
                <button class="filter-btn" data-category="scam-awareness">Scam Awareness</button>
                <button class="filter-btn" data-category="education">Education</button>
                <button class="filter-btn" data-category="opportunities">Opportunities</button>
                <button class="filter-btn" data-category="lifestyle">Lifestyle</button>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search articles...">
            </div>
        </div>

        <!-- Blog Grid -->
        <div class="blog-grid" id="blogGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner"></i>
                <p>Loading articles...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div data-shared-footer></div>



    <script type="module" src="scripts/shared-layout.js?v=20261014-clickable-social"></script>
</body>

</html>
